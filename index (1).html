<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QauypZhoq</title>
<meta name="description" content="">
<style>
:root{
  --bg:#0a0f1c; --bg2:#0f1629; --card:#131c33; --card2:#1a2542; --line:#25325a;
  --text:#e8edf9; --muted:#97a3c4; --accent:#2de2b0; --accent2:#4f8cff;
  --ok:#2de2b0; --warn:#ffc24b; --bad:#ff5c72; --radius:18px;
  --shadow:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","Noto Sans Arabic",Arial,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(79,140,255,.18),transparent 60%),
             radial-gradient(900px 500px at -10% 10%,rgba(45,226,176,.14),transparent 60%),var(--bg);
  color:var(--text);line-height:1.6;min-height:100vh;
}
a{color:var(--accent2);text-decoration:none}
.container{width:min(1120px,100% - 32px);margin-inline:auto}
section{padding:72px 0}
h1,h2,h3{line-height:1.2}
h2{font-size:clamp(26px,4vw,38px);margin-bottom:10px}
.sub{color:var(--muted);max-width:680px;margin-bottom:32px}
.tag{display:inline-block;font-size:13px;color:var(--accent);background:rgba(45,226,176,.1);border:1px solid rgba(45,226,176,.3);padding:4px 12px;border-radius:99px;margin-bottom:14px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(10,15,28,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--text)}
.logo svg{width:32px;height:32px}
.logo span b{color:var(--accent)}
nav ul{display:flex;gap:4px;list-style:none}
nav a{color:var(--muted);padding:8px 11px;border-radius:10px;font-size:15px;transition:.2s;white-space:nowrap}
nav a:hover{color:var(--text);background:var(--card)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:9px;cursor:pointer;transition:.2s}
.lang button:hover{color:var(--text)}
.lang button.on{background:linear-gradient(90deg,var(--accent),#27b9d6);color:#04231b}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:10px;font-size:20px;cursor:pointer}

/* hero */
.hero{padding:90px 0 50px;text-align:center}
.hero h1{font-size:clamp(32px,6vw,60px);font-weight:800;letter-spacing:-1px;margin-bottom:18px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:18px;max-width:660px;margin:0 auto 30px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;padding:13px 24px;border-radius:12px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(90deg,var(--accent),#27b9d6);color:#04231b}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(45,226,176,.35)}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--accent2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stat b{display:block;font-size:30px;color:var(--accent)}
.stat span{color:var(--muted);font-size:14px}

/* cards & tools */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.tool{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
label.lbl{display:block;font-weight:600;margin-bottom:8px}
input[type=text],input[type=password],textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:14px 16px;border-radius:12px;font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(79,140,255,.2)}
textarea{min-height:170px;resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover,.chip.active{color:var(--text);border-color:var(--accent);background:rgba(45,226,176,.1)}

/* result */
.result{min-height:220px}
.placeholder{color:var(--muted);text-align:center;padding:50px 10px}
.placeholder .ico{font-size:42px;display:block;margin-bottom:8px}
.verdict{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.score{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);position:relative}
.score::after{content:"";position:absolute;inset:7px;background:var(--card);border-radius:50%}
.score span{position:relative;z-index:1}
.verdict h3{font-size:20px}
.verdict p{color:var(--muted);font-size:14px}
.lvl-ok{--c:var(--ok)} .lvl-warn{--c:var(--warn)} .lvl-bad{--c:var(--bad)}
.findings{list-style:none;display:grid;gap:8px}
.findings li{display:flex;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:14px}
.findings li i{font-style:normal;flex-shrink:0}
.findings li small{display:block;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.bad{background:rgba(255,92,114,.15);color:var(--bad)}
.pill.warn{background:rgba(255,194,75,.15);color:var(--warn)}
.pill.ok{background:rgba(45,226,176,.15);color:var(--ok)}
mark{background:rgba(255,92,114,.25);color:#ffd5db;padding:0 3px;border-radius:4px}
.marked{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;font-size:14px;max-height:200px;overflow:auto}
.langdet{display:inline-block;font-size:13px;color:var(--accent2);background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.3);border-radius:99px;padding:3px 12px;margin-bottom:12px}
.advice{margin-top:16px;padding:14px;border-radius:12px;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.3);font-size:14px}

/* password */
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.meter div{height:100%;width:0;border-radius:99px;transition:.35s;background:var(--bad)}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:6px}
.checks{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0;font-size:14px}
.checks li{color:var(--muted)} .checks li.on{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.kv small{color:var(--muted);display:block;font-size:12px}
.kv b{font-size:17px}
.gen{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
.gen-out{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;word-break:break-all;margin:12px 0}
input[type=range]{width:100%;accent-color:var(--accent)}

/* threats */
.search{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.search input{flex:1;min-width:220px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.threats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.threat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.2s}
.threat:hover{border-color:var(--accent2);transform:translateY(-3px)}
.threat h3{font-size:18px;margin:8px 0}
.threat p{color:var(--muted);font-size:14px}
.threat .more{display:none;margin-top:14px;font-size:14px;border-top:1px dashed var(--line);padding-top:12px}
.threat.open .more{display:block}
.threat ul{padding-left:18px;margin:6px 0 10px;color:var(--muted)}
.threat .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:8px}
.empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--warn)}
.table-wrap{overflow-x:auto;margin-top:26px}

/* quiz */
.quiz{max-width:760px;margin:auto}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.4s}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}
.qtext{font-size:20px;font-weight:600;margin-bottom:18px}
.qbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:12px;font:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt.right{border-color:var(--ok);background:rgba(45,226,176,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,92,114,.12)}
.opt:disabled{cursor:default}
.expl{margin-top:16px;padding:14px;border-radius:12px;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.3);font-size:14px}
.final{text-align:center;padding:20px 0}
.final .big{font-size:64px;font-weight:800}

footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:14px;text-align:center}
footer p+p{margin-top:8px}

@media(max-width:1000px){
  .burger{display:block}
  nav ul{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
  nav ul.open{display:flex}
}
@media(max-width:860px){
  .tool{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  section{padding:52px 0}
}
@media(max-width:480px){
  .checks,.kv{grid-template-columns:1fr}
  .logo span{display:none}
  .lang button{padding:6px 8px}
}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="logo" href="#top" aria-label="QauypZhoq">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 2 4 7v8c0 7.5 5 12.7 12 15 7-2.3 12-7.5 12-15V7L16 2Z" fill="url(#g)"/><path d="m10.5 16 4 4 7-8" stroke="#04231b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="4" y1="2" x2="28" y2="30"><stop stop-color="#2de2b0"/><stop offset="1" stop-color="#4f8cff"/></linearGradient></defs></svg>
      <span>Qauyp<b>Zhoq</b></span>
    </a>
    <nav>
      <ul id="menu">
        <li><a href="#links" data-i18n="nav.links"></a></li>
        <li><a href="#messages" data-i18n="nav.messages"></a></li>
        <li><a href="#password" data-i18n="nav.password"></a></li>
        <li><a href="#threats" data-i18n="nav.threats"></a></li>
        <li><a href="#quiz" data-i18n="nav.quiz"></a></li>
      </ul>
    </nav>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ru" aria-label="Русский">RU</button>
        <button type="button" data-lang="kk" aria-label="Қазақша">ҚАЗ</button>
        <button type="button" data-lang="en" aria-label="English">EN</button>
      </div>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="container hero">
    <span class="tag" data-i18n="hero.tag"></span>
    <h1 data-i18n-html="hero.h1"></h1>
    <p data-i18n="hero.p"></p>
    <div class="btns">
      <a class="btn btn-primary" href="#links" data-i18n="hero.cta1"></a>
      <a class="btn btn-ghost" href="#quiz" data-i18n="hero.cta2"></a>
    </div>
    <div class="stats">
      <div class="stat"><b>20+</b><span data-i18n="stat.1"></span></div>
      <div class="stat"><b>12</b><span data-i18n="stat.2"></span></div>
      <div class="stat"><b>12</b><span data-i18n="stat.3"></span></div>
      <div class="stat"><b>100%</b><span data-i18n="stat.4"></span></div>
    </div>
  </div>

  <!-- 1. LINKS -->
  <section id="links">
    <div class="container">
      <span class="tag" data-i18n="tool.1"></span>
      <h2 data-i18n="url.h"></h2>
      <p class="sub" data-i18n="url.sub"></p>
      <div class="tool">
        <div class="card">
          <label class="lbl" for="urlInput" data-i18n="url.lbl"></label>
          <input type="text" id="urlInput" placeholder="https://example.com/login" autocomplete="off" spellcheck="false">
          <div class="row">
            <button class="btn btn-primary" id="urlBtn" data-i18n="url.btn"></button>
            <button class="btn btn-ghost" id="urlClear" data-i18n="clear"></button>
          </div>
          <p class="hint" data-i18n="url.hint"></p>
          <div class="examples">
            <button class="chip" data-url="https://www.kaspi.kz/shop" data-i18n="url.ex1"></button>
            <button class="chip" data-url="http://kaspi-bonus-verify.top/login?id=88231" data-i18n="url.ex2"></button>
            <button class="chip" data-url="http://192.168.44.12:8080/secure/update-account@paypa1.com" data-i18n="url.ex3"></button>
            <button class="chip" data-url="https://kаspi.kz/login" data-i18n="url.ex4"></button>
          </div>
        </div>
        <div class="card result" id="urlResult"></div>
      </div>
    </div>
  </section>

  <!-- 2. MESSAGES -->
  <section id="messages" style="background:rgba(15,22,41,.5)">
    <div class="container">
      <span class="tag" data-i18n="tool.2"></span>
      <h2 data-i18n="msg.h"></h2>
      <p class="sub" data-i18n="msg.sub"></p>
      <div class="tool">
        <div class="card">
          <label class="lbl" for="msgInput" data-i18n="msg.lbl"></label>
          <textarea id="msgInput" data-i18n-ph="msg.ph"></textarea>
          <div class="row">
            <button class="btn btn-primary" id="msgBtn" data-i18n="msg.btn"></button>
            <button class="btn btn-ghost" id="msgClear" data-i18n="clear"></button>
          </div>
          <div class="examples">
            <button class="chip" id="ex1" data-i18n="msg.ex1"></button>
            <button class="chip" id="ex2" data-i18n="msg.ex2"></button>
            <button class="chip" id="ex3" data-i18n="msg.ex3"></button>
            <button class="chip" id="ex4" data-i18n="msg.ex4"></button>
          </div>
        </div>
        <div class="card result" id="msgResult"></div>
      </div>
    </div>
  </section>

  <!-- 3. PASSWORD -->
  <section id="password">
    <div class="container">
      <span class="tag" data-i18n="tool.3"></span>
      <h2 data-i18n="pw.h"></h2>
      <p class="sub" data-i18n="pw.sub"></p>
      <div class="tool">
        <div class="card">
          <label class="lbl" for="pwInput" data-i18n="pw.lbl"></label>
          <div class="pw-wrap">
            <input type="password" id="pwInput" data-i18n-ph="pw.ph" autocomplete="off" spellcheck="false">
            <button id="pwToggle" type="button" aria-label="Show / hide">👁</button>
          </div>
          <div class="meter"><div id="pwBar"></div></div>
          <b id="pwLabel" style="font-size:15px"></b>
          <ul class="checks" id="pwChecks">
            <li data-k="len" data-i18n="pw.c.len"></li>
            <li data-k="low" data-i18n="pw.c.low"></li>
            <li data-k="up" data-i18n="pw.c.up"></li>
            <li data-k="num" data-i18n="pw.c.num"></li>
            <li data-k="sym" data-i18n="pw.c.sym"></li>
            <li data-k="uniq" data-i18n="pw.c.uniq"></li>
          </ul>
          <div class="kv">
            <div><small data-i18n="pw.ent"></small><b id="pwEnt">—</b></div>
            <div><small data-i18n="pw.time"></small><b id="pwTime">—</b></div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:10px" data-i18n="pw.tips.h"></h3>
          <ul class="findings" id="pwTips"></ul>
          <div class="gen">
            <h3 data-i18n="gen.h"></h3>
            <div class="gen-out" id="genOut"></div>
            <label class="lbl" for="genLen"><span data-i18n="gen.len"></span> <span id="genLenV">16</span></label>
            <input type="range" id="genLen" min="12" max="32" value="16">
            <div class="row">
              <button class="btn btn-primary" id="genBtn" data-i18n="gen.btn"></button>
              <button class="btn btn-ghost" id="genCopy" data-i18n="gen.copy"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. THREATS -->
  <section id="threats" style="background:rgba(15,22,41,.5)">
    <div class="container">
      <span class="tag" data-i18n="kb.tag"></span>
      <h2 data-i18n="th.h"></h2>
      <p class="sub" data-i18n="th.sub"></p>
      <div class="search">
        <input type="text" id="thSearch" data-i18n-ph="th.search">
      </div>
      <div class="filters" id="thFilters" style="margin-bottom:22px"></div>
      <div class="threats" id="thList"></div>

      <div class="table-wrap card" style="padding:20px">
        <h3 data-i18n="th.tbl.h"></h3>
        <p class="hint" style="margin:6px 0 10px" data-i18n="th.tbl.note"></p>
        <table>
          <thead><tr><th data-i18n="th.c1"></th><th data-i18n="th.c2"></th><th data-i18n="th.c3"></th></tr></thead>
          <tbody id="thTbl"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 5. QUIZ -->
  <section id="quiz">
    <div class="container">
      <span class="tag" data-i18n="quiz.tag"></span>
      <h2 data-i18n="quiz.h"></h2>
      <p class="sub" data-i18n="quiz.sub"></p>
      <div class="card quiz" id="quizBox"></div>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p><b>QauypZhoq</b> — <span data-i18n="foot.1"></span></p>
    <p data-i18n="foot.2"></p>
    <p data-i18n="foot.3"></p>
  </div>
</footer>

<script>
"use strict";
const R = String.raw;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =====================================================================
   I18N — Русский / Қазақша / English
   ===================================================================== */
const T = {
/* ------------------------------- РУССКИЙ ------------------------------- */
ru: {
 'page.title':'QauypZhoq — интеллектуальная защита от мошенничества',
 'page.desc':'QauypZhoq помогает распознавать фишинговые ссылки, мошеннические сообщения, проверять пароли и учит киберграмотности.',
 'nav.links':'Ссылки','nav.messages':'Сообщения','nav.password':'Пароли','nav.threats':'База угроз','nav.quiz':'Обучение',

let LANG = 'ru';
const SUPPORTED = ['ru','kk','en'];
function t(key, p){
  let s = (T[LANG] && T[LANG][key]); if (s === undefined) s = T.en[key]; if (s === undefined) s = key;
  if (p && typeof p === 'object') s = s.replace(/\{(\w+)\}/g, (m,k) => (p[k] !== undefined ? p[k] : m));
  return s;
}
function pickLang(){
  try { const q = new URLSearchParams(location.search).get('lang'); if (SUPPORTED.includes(q)) return q; } catch(e){}
  try { const s = localStorage.getItem('qz_lang'); if (SUPPORTED.includes(s)) return s; } catch(e){}
  const n = (navigator.language || 'ru').toLowerCase();
  if (n.startsWith('kk')) return 'kk';
  if (/^(ru|uk|be)/.test(n)) return 'ru';
  if (n.startsWith('en')) return 'en';
  return 'ru';
}
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t('page.title');
  const md = $('meta[name=description]'); if (md) md.setAttribute('content', t('page.desc'));
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  $$('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
function setLang(l){
  if (!SUPPORTED.includes(l)) return;
  LANG = l;
  try { localStorage.setItem('qz_lang', l); } catch(e){}
  applyStatic();
  renderURL(); renderMsg(); renderPassword(); renderGenPlaceholder(); renderThreats(); renderTable(); renderQuiz();
}

function lvl(score){
  if (score < 25) return {cls:'lvl-ok',  k:'v.low'};
  if (score < 55) return {cls:'lvl-warn',k:'v.mid'};
  return              {cls:'lvl-bad', k:'v.high'};
}
function renderVerdict(score, findings, prefix, extra=''){
  const l = lvl(score);
  const items = findings.length
    ? findings.map(f => `<li><i>${f.type==='bad'?'🔴':f.type==='warn'?'🟠':'🟢'}</i><div><b>${esc(t(prefix+f.k, f.p))}</b> <span class="pill ${f.type}">${f.type==='ok'?'ok':'+'+f.w}</span><small>${esc(t(prefix+f.k+'.d', f.p))}</small></div></li>`).join('')
    : `<li><i>🟢</i><div><b>${esc(t('res.none'))}</b></div></li>`;
  return `<div class="verdict ${l.cls}"><div class="score" style="--p:${score}"><span>${score}</span></div>
    <div><h3>${esc(t(l.k+'.t'))}</h3><p>${esc(t(l.k+'.d'))}</p></div></div>${extra}<ul class="findings">${items}</ul>`;
}
function placeholderHTML(ico, key){ return `<div class="placeholder"><span class="ico">${ico}</span>${esc(t(key))}</div>`; }
function levenshtein(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}

function extractURL(raw){

const STOP = {

 es:['el','la','de','que','su','cuenta','para','por','una','los','las','ha','sido','con','se','usted','favor'],

function detectLang(text){
  const cnt = re => (text.match(re)||[]).length;
  const cyr = cnt(/\p{Script=Cyrillic}/gu), lat = cnt(/\p{Script=Latin}/gu), han = cnt(/\p{Script=Han}/gu), ara = cnt(/\p{Script=Arabic}/gu);
  const mx = Math.max(cyr,lat,han,ara); if (!mx) return null;
  if (mx === han) return 'zh';
  if (mx === ara) return 'ar';
  if (mx === cyr){
    if (/[әңғүұқөһӘҢҒҮҰҚӨҺ]/.test(text)) return 'kk';
    if (/[їєґЇЄҐ]/.test(text)) return 'uk';
    if (/і/i.test(text) && !/[ыэё]/i.test(text) && /[іІ]/.test(text) && !/и/.test(text)) return 'uk';
    return 'ru';
  }
  const words = text.toLowerCase().match(/[\p{L}']+/gu) || [];
  const sc = {};
  for (const [l,list] of Object.entries(STOP)) sc[l] = words.filter(w => list.includes(w)).length;
  if (/[ıİşŞğĞ]/.test(text)) sc.tr += 3;
  if (/[ñ¿¡]/.test(text)) sc.es += 3;
  if (/[äöüß]/i.test(text)) sc.de += 2;
  if (/[ãõ]/i.test(text)) sc.pt += 3;
  if (/[àâêèëîïôûùœ]/i.test(text)) sc.fr += 1;
  if (/[oOgG]['‘’ʻ`]/.test(text)) sc.uz += 3;
  const best = Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best[1] >= 1 ? best[0] : 'en';
}
function langName(code){
  try { const n = new Intl.DisplayNames([LANG], {type:'language'}).of(code); if (n) return n.charAt(0).toUpperCase()+n.slice(1); } catch(e){}
  return code;
}

function analyzeMsg(textRaw){
  const text = textRaw.normalize('NFC').replace(/[​-‍﻿]/g,'');
  const F = []; const ranges = [];
  for (const r of RULES){
    const re = new RegExp(r.re.source, r.re.flags);
    let m, hit = false;
    while ((m = re.exec(text)) !== null){
      if (m[0].length === 0){ re.lastIndex++; continue; }
      hit = true; ranges.push([m.index, m.index + m[0].length]);
    }
    if (hit) F.push({type: r.w>=20?'bad':'warn', w:r.w, k:r.k});
  }
  // языконезависимые сигналы
  const urls = text.match(URL_RE);
  if (urls){ F.push({type:'warn', w:12, k:'link'}); let m; const re = new RegExp(URL_RE.source, URL_RE.flags); while((m=re.exec(text))!==null) ranges.push([m.index, m.index+m[0].length]); }
  { const re = new RegExp(SHORT_RE.source, SHORT_RE.flags); let m, hit=false; while((m=re.exec(text))!==null){ hit=true; ranges.push([m.index, m.index+m[0].length]); } if (hit) F.push({type:'warn', w:15, k:'short'}); }
  const letters = text.match(/\p{L}/gu) || [], caps = text.match(/\p{Lu}/gu) || [];
  if (/!{2,}|！{2,}|‼/.test(text) || (letters.length>15 && caps.length/letters.length>0.4)) F.push({type:'warn', w:8, k:'caps'});

  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for (const r of ranges){
    if (merged.length && r[0] <= merged[merged.length-1][1]) merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], r[1]);
    else merged.push([...r]);
  }
  let html = '', pos = 0;
  for (const [s,e] of merged){ html += esc(text.slice(pos,s)) + '<mark>' + esc(text.slice(s,e)) + '</mark>'; pos = e; }
  html += esc(text.slice(pos));
  const sum = F.reduce((a,f)=>a+f.w,0);
  const score = Math.min(100, Math.round(sum > 60 ? 60 + (sum-60)*0.6 : sum));
  return {score, F, html, urls: urls ? urls[0].replace(/[.,;:!?)»”]+$/,'') : null, lang: detectLang(text)};
}

const COMMON = ['password','123456','12345678','123456789','qwerty','qwerty123','111111','000000','abc123','iloveyou','admin','welcome','letmein','monkey','dragon','football','пароль','йцукен','привет','12345','1q2w3e','1qaz2wsx','qazwsx','password1','passw0rd','admin123','777777','123123','zaq12wsx','qwertyuiop','kazakhstan','almaty','astana','қазақстан','құпиясөз','сәлем','sifre','şifre','parola','contraseña','motdepasse','passwort','senha','密码','123456789','أهلا'];
const SEQS = ['abcdefghijklmnopqrstuvwxyz','0123456789','qwertyuiop','asdfghjkl','zxcvbnm','йцукенгшщзхъ','фывапролджэ','ячсмитьбю','әіңғүұқөһ','qwertzuiop','azertyuiop'];
function hasSequence(p){
  const s = [...p.toLowerCase()].join('');
  for (const seq of SEQS){
    const a = [...seq];
    for (let i=0;i<=a.length-4;i++){
      const part = a.slice(i,i+4).join('');
      if (s.includes(part) || s.includes([...part].reverse().join(''))) return true;
    }
  }
  return false;
}
function fmtTime(sec){
  if (sec < 1) return t('tm.now');
  if (sec < 60) return Math.round(sec)+' '+t('tm.s');
  let v = sec/60; if (v < 60) return Math.round(v)+' '+t('tm.m');
  v/=60; if (v < 24) return Math.round(v)+' '+t('tm.h');
  v/=24; if (v < 365) return Math.round(v)+' '+t('tm.d');
  v/=365; if (v < 1000) return Math.round(v)+' '+t('tm.y');
  if (v < 1e6) return Math.round(v/1000)+' '+t('tm.ky');
  if (v < 1e9) return Math.round(v/1e6)+' '+t('tm.my');
  return t('tm.by');
}
function analyzePassword(p){
  const has = {low:/\p{Ll}/u.test(p), up:/\p{Lu}/u.test(p), num:/\p{N}/u.test(p), sym:/[^\p{L}\p{N}]/u.test(p)};
  let pool = 0;
  if (/[a-z]/.test(p)) pool += 26;
  if (/[A-Z]/.test(p)) pool += 26;
  if (/\p{Script=Cyrillic}/u.test(p)){ if (/\p{Ll}/u.test(p.replace(/[^\p{Script=Cyrillic}]/gu,''))) pool += 42; if (/\p{Lu}/u.test(p.replace(/[^\p{Script=Cyrillic}]/gu,''))) pool += 42; }
  if (/\p{N}/u.test(p)) pool += 10;
  if (/[^\p{L}\p{N}]/u.test(p)) pool += 33;
  if (/\p{Lo}/u.test(p)) pool += 300;                                  // иероглифы, арабица и т.п.
  if (/[^\u0000-\u007f\p{Script=Cyrillic}\p{Lo}\p{N}\p{P}\p{S}\p{Z}]/u.test(p)) pool += 30;   // ñ, ü, ş и т.п.
  const chars = [...p];
  let ent = chars.length * Math.log2(Math.max(pool,2));
  const issues = [];
  const lower = p.toLowerCase();
  const leetBase = lower.replace(/0/g,'o').replace(/1/g,'l').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/@/g,'a').replace(/\$/g,'s');
  const isCommon = COMMON.some(c => lower === c || leetBase === c);
  const containsCommon = COMMON.some(c => [...c].length>=5 && (lower.includes(c) || leetBase.includes(c)));
  if (isCommon){ ent = Math.min(ent, 8); issues.push('pw.i.common'); }
  else if (containsCommon){ ent *= 0.55; issues.push('pw.i.contains'); }
  if (/(.)\1{2,}/u.test(p)){ ent *= 0.8; issues.push('pw.i.repeat'); }
  if (hasSequence(p)){ ent *= 0.75; issues.push('pw.i.seq'); }
  if (/(?:19|20)\d{2}$/.test(p)){ ent *= 0.9; issues.push('pw.i.year'); }
  if (/^\p{N}+$/u.test(p)) issues.push('pw.i.digits');
  if (/^\p{L}+$/u.test(p) && chars.length < 14) issues.push('pw.i.letters');
  if (chars.length>=6 && new Set(chars).size < chars.length*0.5){ ent *= 0.85; issues.push('pw.i.few'); }
  const guesses = Math.pow(2, Math.min(ent, 200)) / 2;
  const seconds = guesses / 1e10;
  return {has, ent: Math.round(ent), seconds, issues, long: chars.length >= 12, uniq: issues.length===0, len: chars.length};
}

  const p = $('#pwInput').value;

function generatePassword(len){
  const sets = ['abcdefghijkmnopqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789','!@#$%^&*?-_=+'];
  const all = sets.join('');
  const rnd = n => { const a = new Uint32Array(1); const lim = Math.floor(0x100000000 / n) * n; let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return x % n; };
  const out = sets.map(s => s[rnd(s.length)]);
  while (out.length < len) out.push(all[rnd(all.length)]);
  for (let i=out.length-1;i>0;i--){ const j = rnd(i+1); [out[i],out[j]] = [out[j],out[i]]; }
  return out.join('');
}

  $('#thList').innerHTML = list.length ? list.map(x => `
    <article class="threat ${THOPEN.has(x.i)?'open':''}" data-i="${x.i}" tabindex="0">
      <div class="top"><span>${esc(t('cat.'+x.cat))}</span><span class="pill ${x.lv==='high'?'bad':'warn'}">${esc(t('lvl.'+x.lv))}</span></div>
      <h3>${esc(x.t)}</h3>
      <p>${esc(x.d)}</p>
      <div class="more">
        <b>${esc(t('th.signs'))}</b>
        <ul>${x.s.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        <b>${esc(t('th.todo'))}</b> ${esc(x.tip)}
      </div>
    </article>`).join('') : `<div class="empty">${esc(t('th.empty'))}</div>`;
  $$('.threat').forEach(el => {
    const toggle = () => { const i = +el.dataset.i; el.classList.toggle('open'); el.classList.contains('open') ? THOPEN.add(i) : THOPEN.delete(i); };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
  });
}
function renderTable(){
  $('#thTbl').innerHTML = TBL_ADDR.map((a,i) => `<tr><td><code>${esc(a)}</code></td><td>${esc(TBL[LANG][i][0])}</td><td>${esc(TBL[LANG][i][1])}</td></tr>`).join('');
}
$('#thSearch').addEventListener('input', e => { thQ = e.target.value; renderThreats(); });

/* =====================================================================
   5. ТЕСТ
   ===================================================================== */
const quiz = {order:[], i:0, score:0, chosen:null};
function bestScore(){ try { return +(localStorage.getItem('qz_best')||0); } catch(e){ return 0; } }
function saveBest(v){ try { if (v > bestScore()) localStorage.setItem('qz_best', v); } catch(e){} }
function startQuiz(){
  quiz.order = QA.map((_,i)=>i).sort(()=>Math.random()-.5);
  quiz.i = 0; quiz.score = 0; quiz.chosen = null; renderQuiz();
}
function renderQuiz(){
  const box = $('#quizBox'); if (!quiz.order.length) return;
  const total = quiz.order.length;
  if (quiz.i >= total){
    saveBest(quiz.score);
    const p = quiz.score/total;
    const msg = t(p===1 ? 'quiz.m1' : p>=.7 ? 'quiz.m2' : p>=.4 ? 'quiz.m3' : 'quiz.m4');
    box.innerHTML = `<div class="final"><div class="big grad">${quiz.score}/${total}</div><h3>${esc(msg)}</h3>
      <p class="hint">${esc(t('quiz.best',{b:bestScore(),n:total}))}</p>
      <div class="row" style="justify-content:center"><button class="btn btn-primary" id="qAgain">${esc(t('quiz.again'))}</button><a class="btn btn-ghost" href="#threats">${esc(t('quiz.db'))}</a></div></div>`;
    $('#qAgain').addEventListener('click', startQuiz); return;
  }
  const idx = quiz.order[quiz.i];
  const q = QS[LANG][idx], correct = QA[idx];
  const answered = quiz.chosen !== null;
  box.innerHTML = `
    <div class="progress"><div style="width:${(quiz.i/total)*100}%"></div></div>
    <div class="qmeta"><span>${esc(t('quiz.q',{i:quiz.i+1,n:total}))}</span><span>${esc(t('quiz.pts',{s:quiz.score}))}</span></div>
    ${q.box ? `<div class="qbox">${esc(q.box)}</div>` : ''}<div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,i)=>{
      let cls = ''; if (answered){ if (i===correct) cls='right'; else if (i===quiz.chosen) cls='wrong'; }
      return `<button class="opt ${cls}" data-i="${i}" ${answered?'disabled':''}>${esc(o)}</button>`; }).join('')}</div>
    <div id="qFb">${answered ? feedbackHTML(q, quiz.chosen===correct, quiz.i===total-1) : ''}</div>`;
  $$('.opt', box).forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
  const nx = $('#qNext'); if (nx) nx.addEventListener('click', () => { quiz.i++; quiz.chosen = null; renderQuiz(); });
}
function feedbackHTML(q, ok, last){
  return `<div class="expl"><b>${esc(t(ok?'quiz.ok':'quiz.bad'))}</b> ${esc(q.e)}</div>
    <div class="row"><button class="btn btn-primary" id="qNext">${esc(t(last?'quiz.res':'quiz.next'))}</button></div>`;
}
function answer(i){
  if (quiz.chosen !== null) return;
  quiz.chosen = i;
  if (i === QA[quiz.order[quiz.i]]) quiz.score++;
  renderQuiz();
}

/* =====================================================================
   Запуск
   ===================================================================== */
LANG = pickLang();
applyStatic();
renderURL(); renderMsg(); renderPassword(); renderGenPlaceholder(); renderThreats(); renderTable();
startQuiz();
</script>
